<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Arena</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="home-container">

        <section class="hero-card">

            <div class="game-logo">
                <span>×</span>
                <span>○</span>
            </div>

            <p class="small-title">WELCOME TO</p>

            <h1>Tic-Tac-Toe <span>Arena</span></h1>

            <p class="subtitle">
                A quick, focused board for friendly rivalry or a battle against the machine.
            </p>

            <div class="players-form">

                <div class="player-input">
                    <label for="playerX">Player X</label>
                    <input
                        type="text"
                        id="playerX"
                        placeholder="Enter Player X name"
                        maxlength="15"
                    >
                </div>

                <div class="vs">VS</div>

                <div class="player-input">
                    <label for="playerO">Player O</label>
                    <input
                        type="text"
                        id="playerO"
                        placeholder="Enter Player O name"
                        maxlength="15"
                    >
                </div>

            </div>

            <div class="setup-grid">
                <label class="setup-control" for="gameMode">
                    <span>Game mode</span>
                    <select id="gameMode">
                        <option value="local">2 players</option>
                        <option value="ai">Play vs AI</option>
                    </select>
                </label>

                <label class="setup-control" for="turnTimer">
                    <span>Turn timer</span>
                    <select id="turnTimer">
                        <option value="0">No timer</option>
                        <option value="15">15 seconds</option>
                        <option value="30" selected>30 seconds</option>
                        <option value="60">60 seconds</option>
                    </select>
                </label>

                <label class="setup-control" for="seriesMode">
                    <span>Match format</span>
                    <select id="seriesMode">
                        <option value="single">Single game</option>
                        <option value="bestOf3" selected>Best of 3</option>
                    </select>
                </label>

                <label class="setup-control" for="aiDifficulty">
                    <span>AI difficulty</span>
                    <select id="aiDifficulty">
                        <option value="easy">Easy</option>
                        <option value="normal" selected>Normal</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>

                <label class="setup-control style-choice" for="boardStyle">
                    <span>Board style</span>
                    <select id="boardStyle">
                        <option value="classic">Classic</option>
                        <option value="neon">Neon</option>
                        <option value="glass" selected>Glass</option>
                        <option value="minimal">Minimal</option>
                    </select>
                </label>
            </div>

            <div class="preference-row">
                <label class="toggle-control">
                    <input type="checkbox" id="soundEnabled" checked>
                    <span class="toggle-switch"></span>
                    <span>Music &amp; sounds</span>
                </label>
            </div>

            <button id="startGameBtn" class="primary-btn">
                Start Game
                <span>→</span>
            </button>

            <button id="leaderboardBtn" class="secondary-btn">
                🏆 View Leaderboard
            </button>

            <p class="game-info">
                🎮 Profiles saved on this device &nbsp; • &nbsp; 3 × 3 Board
            </p>

        </section>

    </main>

    <script src="js/home.js"></script>

</body>
</html>
